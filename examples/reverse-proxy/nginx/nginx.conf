worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    # Every temporary path is under /tmp: the root filesystem is read-only.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # $uri, not $request: query strings stay out of the log.
    log_format dockmin '$remote_addr "$request_method $uri" $status $body_bytes_sent';
    access_log /dev/stdout dockmin;

    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    upstream dockmin {
        include /tmp/dockmin-upstream.conf;
        keepalive 16;
    }

    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate     /run/secrets/proxy_tls_cert;
        ssl_certificate_key /run/secrets/proxy_tls_key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # dockmin caps every other request body at 256 KiB.
        client_max_body_size 1m;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        location / {
            proxy_pass http://dockmin;
        }

        location ~ ^/environments/[^/]+/containers/[^/]+/terminal/ws$ {
            proxy_pass http://dockmin;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Server-sent events, log downloads and the activity export.
        location ~ ^/.+/(stream|events|logs/download)$ {
            proxy_pass http://dockmin;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        location = /activity/-/export {
            proxy_pass http://dockmin;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        # The first byte is sent after the archive is produced.
        location = /backups/download {
            proxy_pass http://dockmin;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        # Archives up to 7 GiB; the request body is not buffered.
        location = /restore/archive {
            proxy_pass http://dockmin;
            client_max_body_size 7g;
            client_body_timeout 600s;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location ~ ^/environments/[^/]+/stacks/[^/]+/contexts/-/upload$ {
            proxy_pass http://dockmin;
            client_max_body_size 17m;
            client_body_timeout 300s;
            proxy_request_buffering off;
        }
    }
}
