services:
  dockmin:
    # Only nginx reaches dockmin, and only its fixed address is a trusted proxy.
    ports: !reset []
    environment:
      DOCKMIN_TRUSTED_PROXIES: ${DOCKMIN_PROXY_ADDRESS:-172.29.250.2}/32

  nginx:
    image: nginx:1.31.8-alpine@sha256:a3554c0d0b48177b1413c26e01f695334428020d9df01243fbae3e11cfd17417
    user: "101:101"
    environment:
      DOCKMIN_PORT: ${DOCKMIN_PORT:-8000}
      # The template is rendered into the tmpfs; /etc/nginx stays read-only.
      NGINX_ENVSUBST_OUTPUT_DIR: /tmp
    networks:
      default:
        ipv4_address: ${DOCKMIN_PROXY_ADDRESS:-172.29.250.2}
    ports:
      - "443:8443"
    volumes:
      - ./examples/reverse-proxy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./examples/reverse-proxy/nginx/dockmin-upstream.conf.template:/etc/nginx/templates/dockmin-upstream.conf.template:ro
    # The certificate and key files must be readable by uid 101.
    secrets:
      - proxy_tls_cert
      - proxy_tls_key
    depends_on:
      dockmin:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m
          pids: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    restart: unless-stopped

secrets:
  proxy_tls_cert:
    file: ${DOCKMIN_PROXY_TLS_CERT_SOURCE:-./secrets/proxy_fullchain.pem}
  proxy_tls_key:
    file: ${DOCKMIN_PROXY_TLS_KEY_SOURCE:-./secrets/proxy_privkey.pem}

networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKMIN_PROXY_SUBNET:-172.29.250.0/24}
          # Automatic assignment never hands out the proxy address, which lies outside this range.
          ip_range: ${DOCKMIN_PROXY_IP_RANGE:-172.29.250.128/25}
